[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sjournaller"
version = "1.0.0"
description = "A secure, encrypted personal journal application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SJournaller Team"},
]
keywords = ["journal", "diary", "encrypted", "sqlite", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: News/Diary",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

dependencies = [
    "PyQt6>=6.6.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
    "Pillow>=10.0",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
sjournaller = "sjournaller.main:main"

[project.gui-scripts]
sjournaller-gui = "sjournaller.main:main"

[tool.setuptools.packages.find]
include = ["sjournaller*"]

[tool.setuptools.package-data]
sjournaller = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py310"